<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Чек-лист проверки аккаунта</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --ink:#111827;
    --muted:#6b7280;
    --line:#e5e8f0;
    --accent:#4f46e5;
    --accent-2:#06b6d4;
    --ok:#10b981;
    --shadow:0 10px 30px rgba(17,24,39,.08);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1100px 500px at 10% -10%, #e0e7ff 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 0%, #cffafe 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    line-height:1.5;
    padding:32px 16px 64px;
  }
  .wrap{max-width:880px;margin:0 auto}

  /* ---------- Шапка ---------- */
  .hero{
    display:flex;gap:24px;align-items:center;justify-content:space-between;
    background:var(--card);border:1px solid var(--line);border-radius:22px;
    padding:26px 28px;box-shadow:var(--shadow);
  }
  .eyebrow{
    margin:0 0 6px;font-size:12px;font-weight:700;letter-spacing:.12em;
    text-transform:uppercase;color:var(--accent);
  }
  .hero h1{margin:0 0 8px;font-size:26px;line-height:1.2;letter-spacing:-.02em}
  .sub{margin:0;color:var(--muted);font-size:14px;max-width:44ch}
  .dial{position:relative;flex:0 0 auto;width:118px;height:118px}
  .dial svg{width:118px;height:118px;transform:rotate(-90deg)}
  .dial circle{fill:none;stroke-width:10;stroke-linecap:round}
  .dial-bg{stroke:var(--line)}
  .dial-fg{
    stroke:url(#grad);stroke-dasharray:326.7;stroke-dashoffset:326.7;
    transition:stroke-dashoffset .45s cubic-bezier(.4,0,.2,1);
  }
  .dial-label{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2px;
  }
  .dial-label span{font-size:24px;font-weight:800;letter-spacing:-.03em}
  .dial-label small{font-size:11px;color:var(--muted);font-weight:600}

  .bar{height:8px;border-radius:99px;background:#e9ecf5;margin:18px 0 24px;overflow:hidden}
  .bar-fill{
    height:100%;width:0%;border-radius:99px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    transition:width .45s cubic-bezier(.4,0,.2,1);
  }

  /* ---------- Группы ---------- */
  .group{margin-bottom:18px}
  .group-head{
    display:flex;align-items:center;gap:10px;margin:0 0 10px 4px;
  }
  .group-head h2{
    margin:0;font-size:13px;font-weight:800;letter-spacing:.08em;
    text-transform:uppercase;color:#374151;
  }
  .group-head .rule{flex:1;height:1px;background:var(--line)}
  .group-head .tally{
    font-size:11px;font-weight:700;color:var(--muted);background:#eef1f8;
    padding:2px 8px;border-radius:99px;
  }

  /* ---------- Пункт ---------- */
  .item{
    display:flex;gap:14px;align-items:flex-start;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:14px 16px;margin-bottom:8px;cursor:pointer;
    transition:border-color .2s, box-shadow .2s, transform .12s, background .2s;
  }
  .item:hover{border-color:#c7cdf0;box-shadow:0 6px 18px rgba(79,70,229,.08)}
  .item:active{transform:scale(.996)}
  .item.done{background:#f6fdfa;border-color:#bbf0dc}
  .box{
    flex:0 0 auto;width:22px;height:22px;margin-top:1px;border-radius:7px;
    border:2px solid #cbd2e4;background:#fff;position:relative;
    transition:background .2s,border-color .2s;
  }
  .box::after{
    content:"";position:absolute;left:6.5px;top:2.5px;width:5px;height:10px;
    border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) scale(.3);
    opacity:0;transition:opacity .18s,transform .18s;
  }
  .item.done .box{background:var(--ok);border-color:var(--ok)}
  .item.done .box::after{opacity:1;transform:rotate(45deg) scale(1)}
  .body{flex:1;min-width:0}
  .title{font-size:15px;font-weight:650;letter-spacing:-.01em}
  .item.done .title{color:#0f766e}
  .hint{margin-top:3px;font-size:13px;color:var(--muted)}
  .item.done .hint{color:#5b8d82}
  .num{
    flex:0 0 auto;font-size:11px;font-weight:800;color:#9aa3bb;
    background:#f1f3fa;border-radius:8px;padding:3px 7px;margin-top:1px;
  }
  .item.done .num{color:#0f766e;background:#e6f8f1}

  /* ---------- Финал ---------- */
  .done-banner{
    display:none;margin-top:20px;padding:16px 20px;border-radius:16px;
    background:linear-gradient(90deg,#d1fae5,#cffafe);border:1px solid #a7f3d0;
    color:#065f46;font-weight:700;font-size:15px;text-align:center;
  }
  .done-banner.show{display:block;animation:pop .35s ease}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
  button{
    font:inherit;font-weight:650;font-size:14px;cursor:pointer;
    border-radius:12px;padding:11px 18px;border:1px solid var(--line);
    background:#fff;color:var(--ink);transition:all .18s;
  }
  button:hover{border-color:#c7cdf0;box-shadow:0 6px 16px rgba(17,24,39,.07)}
  button.primary{
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    color:#fff;border:none;
  }
  button.primary:hover{filter:brightness(1.05)}

  @media (max-width:600px){
    .hero{flex-direction:column;align-items:flex-start;padding:22px}
    .hero h1{font-size:22px}
    .dial{width:96px;height:96px}
    .dial svg{width:96px;height:96px}
  }
  @media print{
    body{background:#fff;padding:0}
    .actions,.bar{display:none}
    .hero,.item{box-shadow:none;break-inside:avoid}
    .item{cursor:default}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <div class="hero-text">
      <p class="eyebrow">Контроль качества аккаунта</p>
      <h1>Чек-лист проверки аккаунта</h1>
      <p class="sub">Отмечайте выполненные пункты — прогресс сохраняется автоматически в этом браузере.</p>
    </div>
    <div class="dial">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <defs>
          <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#4f46e5"/>
            <stop offset="100%" stop-color="#06b6d4"/>
          </linearGradient>
        </defs>
        <circle class="dial-bg" cx="60" cy="60" r="52"></circle>
        <circle class="dial-fg" id="dialFg" cx="60" cy="60" r="52"></circle>
      </svg>
      <div class="dial-label">
        <span id="pct">0%</span>
        <small id="count">0 из 10</small>
      </div>
    </div>
  </header>

  <div class="bar"><div class="bar-fill" id="barFill"></div></div>

  <div id="groups"></div>

  <div class="done-banner" id="doneBanner">Проверка завершена: все пункты отмечены</div>

  <div class="actions">
    <button class="primary" id="printBtn">Печать / PDF</button>
    <button id="resetBtn">Сбросить отметки</button>
  </div>
</div>

<script>
const DATA = [
  {
    group: "Товары и витрина",
    items: [
      { t: "Товары размещены в нужном количестве",
        h: "Сверьте число опубликованных позиций с планом размещения." },
      { t: "Витрина (Showcase) включена",
        h: "Убедитесь, что витрина активна и корректно отображается покупателям." }
    ]
  },
  {
    group: "Дизайн",
    items: [
      { t: "Дизайн для ПК-версии засчитан",
        h: "Проверьте статус проверки десктопной версии дизайна." },
      { t: "Дизайн для мобильной версии засчитан",
        h: "Проверьте статус проверки мобильной версии дизайна." },
      { t: "Плашка МД-Инсайт установлена во всех дизайнах",
        h: "Проверьте каждый дизайн: плашка должна быть на месте." }
    ]
  },
  {
    group: "Профиль и контакты",
    items: [
      { t: "Профиль компании заполнен",
        h: "Все обязательные поля профиля заполнены без пробелов." },
      { t: "Контакты компании заполнены",
        h: "Указан менеджер, добавлены фото и контактные данные." },
      { t: "Фото, видео и сертификаты производства загружены",
        h: "Медиа и документы производства добавлены в профиль компании." }
    ]
  },
  {
    group: "Качество и рейтинг",
    items: [
      { t: "Товары без блокировок, дублей и просадки рейтинга",
        h: "Проверьте: нет заблокированных позиций и дублей, рейтинг не занижен." }
    ]
  },
  {
    group: "Рекламное продвижение",
    items: [
      { t: "Продвижение проверено, клиент уведомлён",
        h: "Если реклама запустилась автоматически — обязательно сообщите клиенту." }
    ]
  }
];

const KEY = "account-check-v1";
const items = [];
DATA.forEach(g => g.items.forEach(i => items.push(i)));
const total = items.length;

const root = document.getElementById("groups");
const dialFg = document.getElementById("dialFg");
const barFill = document.getElementById("barFill");
const pctEl = document.getElementById("pct");
const countEl = document.getElementById("count");
const banner = document.getElementById("doneBanner");
const CIRC = 2 * Math.PI * 52;

let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { state = {}; }

let index = 0;
DATA.forEach((g, gi) => {
  const wrap = document.createElement("section");
  wrap.className = "group";

  const head = document.createElement("div");
  head.className = "group-head";
  head.innerHTML = '<h2>' + g.group + '</h2><div class="rule"></div><span class="tally" data-tally="' + gi + '"></span>';
  wrap.appendChild(head);

  g.items.forEach(it => {
    const id = index++;
    const row = document.createElement("div");
    row.className = "item";
    row.setAttribute("role", "checkbox");
    row.setAttribute("tabindex", "0");
    row.setAttribute("aria-checked", "false");
    row.dataset.id = id;
    row.innerHTML =
      '<div class="box"></div>' +
      '<div class="body"><div class="title">' + it.t + '</div><div class="hint">' + it.h + '</div></div>' +
      '<div class="num">' + String(id + 1).padStart(2, "0") + '</div>';

    const toggle = () => {
      state[id] = !state[id];
      try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
      render();
    };
    row.addEventListener("click", toggle);
    row.addEventListener("keydown", e => {
      if (e.key === " " || e.key === "Enter") { e.preventDefault(); toggle(); }
    });

    wrap.appendChild(row);
  });

  root.appendChild(wrap);
});

function render(){
  let done = 0;
  root.querySelectorAll('.item[data-id]').forEach(r => {
    const on = !!state[r.dataset.id];
    r.classList.toggle("done", on);
    r.setAttribute("aria-checked", on ? "true" : "false");
    if (on) done++;
  });

  let start = 0;
  DATA.forEach((g, gi) => {
    const gDone = g.items.reduce((a, _, k) => a + (state[start + k] ? 1 : 0), 0);
    start += g.items.length;
    const tally = root.querySelector('[data-tally="' + gi + '"]');
    if (tally) tally.textContent = gDone + "/" + g.items.length;
  });

  const pct = Math.round(done / total * 100);
  pctEl.textContent = pct + "%";
  countEl.textContent = done + " из " + total;
  barFill.style.width = pct + "%";
  dialFg.style.strokeDashoffset = CIRC - (CIRC * done / total);
  banner.classList.toggle("show", done === total);
}

document.getElementById("resetBtn").addEventListener("click", () => {
  state = {};
  try { localStorage.setItem(KEY, "{}"); } catch (e) {}
  render();
});
document.getElementById("printBtn").addEventListener("click", () => window.print());

render();
</script>
</body>
</html>
